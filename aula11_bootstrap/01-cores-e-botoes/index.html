<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Introdução ao Bootstrap - Cores</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
    <main>
        <section>
            <h1>Cores no Bootstrap</h1>
            <div>
                <p class="h3 text-muted">Class text-muted</p>
                <p class="h3 text-primary">Class text-primary</p>
                <p class="h3 text-success">Class text-success</p>
                <p class="h3 text-info">Class text-info</p>
                <p class="h3 text-warning">Class text-warning</p>
                <p class="h3 text-danger">Class text-danger</p>
                <p class="h3 text-secondary">Class text-secondary</p>
            </div>
        </section>
        <section>
            <h1>Botões no Bootstrap</h1>
            <button type="button" class="btn">Normal</button><br>
            <button type="button" class="btn btn-primary">Primário</button><br> 
            <button type="button" class="btn btn-success">Sucesso</button><br> 
            <button type="button" class="btn btn-info">Info</button><br> 
            <button type="button" class="btn btn-warning">Warning</button><br> 
            <button type="button" class="btn btn-danger">Danger</button><br> 
            <button type="button" class="btn btn-secondary">Secundário</button><br> 
            <button type="button" class="btn btn-dark">Dark</button><br> 
            <button type="button" class="btn btn-light">Light</button><br> 
            <button type="button" class="btn btn-outline-danger">Danger outline</button><br> 
            <button type="button" class="btn btn-outline-primary">Primary outline</button><br> 
            <button type="button" class="btn btn-outline-primary btn-lg">Enviar</button><br> 
            <button type="button" class="btn btn-outline-primary btn-sm">Enviar</button><br>
        </section>
    </main>
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>
</html>
