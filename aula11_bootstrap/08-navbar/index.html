<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar com boostrap</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
    <!-- navbar -->

    <nav class="navbar bg-dark navbar-dark">
        <div class="container-fluid">
            <a href="#" class="navbar-brand">
                Meu Logo
            </a>
            <!-- caixa de pesquisa -->
             <form action="" class="d-flex">
                <input type="text" name="B" id="" class="form-control m-2">
                <button type="button" class="btn btn-danger m-2">Buscar</button>

             </form>

             <!-- botâo de menu escondido -->

             <button type="button" class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu" style="cursor: pointer;">
                <span class="navbar-toggler-icon"></span>
             </button>

             <!-- menu de opções -->
              <div class="navbar-collapse collapse" id="menu">
                <ul class="navbar-nav">
                    <li class="nav-item"><a href="#" class="h6" style="color: white;">Home </a></li>
                    <li class="nav-item"><a href="#" class="h6" style="color: white;">Produtos</a></li>
                    <li class="nav-item"><a href="#" class="h6" style="color: white;">Sobre Nós</a></li>
                </ul>
              </div>

        </div>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>
</body>
</html>
